const p2Dataset = [["Hey, are you free after school?","Personal"],["Can you call me when you're free?","Personal"],["Dinner at my place tonight?","Personal"],["I saved you a seat","Personal"],["Your order is here, come grab it","Personal"],["Your package should arrive today","Personal"],["Hey, your delivery came to my house","Personal"],["Free shipping on your next order","Promotional"],["Save 20% on your order today","Promotional"],["Your package is ready for pickup","Promotional"],["Claim your free trial today","Promotional"],["Limited-time offer just for you","Promotional"],["Your account now includes free delivery","Promotional"],["Special offer ends tonight","Promotional"],["Claim your free prize now","Spam"],["Your account has been locked","Spam"],["Your package could not be delivered","Spam"],["Click here to save your account","Spam"],["You have been selected for a special offer","Spam"],["Free reward waiting for you","Spam"]];



function modelTable(m,word){
 return '<h3>From counts to probabilities</h3><p class="small">Prior = labeled messages / 20. Add-one smoothing gives every vocabulary word a nonzero probability in every class.</p><p class="small">P(word | label) = (word count + 1) / (class word total + vocabulary size).</p><div style="overflow-x:auto"><table><thead><tr><th>Label</th><th>Prior</th><th>Word probability</th></tr></thead><tbody>'+Object.keys(m.docs).map(l=>'<tr><td>'+l+'</td><td>'+m.docs[l]+'/20 = '+(m.docs[l]/20*100).toFixed(1)+'%</td><td>('+m.counts[word][l]+' + 1) / ('+m.totals[l]+' + '+m.V+') = '+((m.counts[word][l]+1)/(m.totals[l]+m.V)*100).toFixed(2)+'%</td></tr>').join('')+'</tbody></table></div>';
}
function predictionMath(r){
 return '<h3>Combine the evidence</h3><p class="small">For each label: score = prior × P(word 1 | label) × P(word 2 | label) × … . The app adds natural logarithms of these factors to avoid tiny-number rounding, then normalizes the scores to sum to 100%.</p><div style="overflow-x:auto"><table><thead><tr><th>Label</th><th>Prior</th><th>Recognized word factors</th><th>Log score</th></tr></thead><tbody>'+Object.keys(r.docs).map(l=>'<tr><td>'+l+'</td><td>'+(r.docs[l]/20).toFixed(3)+'</td><td>'+ (r.toks.filter(w=>r.counts[w]).map(w=>p2Esc(w)+': '+((r.counts[w][l]+1)/(r.totals[l]+r.V)).toFixed(4)).join(' × ')||'None — prior only')+'</td><td>'+r.log[l].toFixed(3)+'</td></tr>').join('')+'</tbody></table></div>';
}
function p2Esc(text){
  return String(text??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function p2Words(text){
  const stop=new Set(["a","an","the","is","at","on","in","of","to","and"]);
  return String(text||"")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g," ")
    .split(/\s+/)
    .filter(w=>w && !stop.has(w));
}
function buildP2Counts(){
  const c={};
  p2Dataset.forEach(([text,label])=>{
    p2Words(text).forEach(w=>{
      c[w] ||= {Personal:0,Promotional:0,Spam:0};
      c[w][label]++;
    });
  });
  return c;
}
function p2Predict(text){
  const counts=buildP2Counts();
  const labs=["Personal","Promotional","Spam"];
  const totals={}, docs={};
  labs.forEach(l=>{
    totals[l]=Object.values(counts).reduce((s,o)=>s+(o[l]||0),0);
    docs[l]=p2Dataset.filter(x=>x[1]===l).length;
  });
  const V=Math.max(1,Object.keys(counts).length);
  const toks=p2Words(text);
  const log={};
  labs.forEach(l=>{
    log[l]=Math.log(docs[l]/p2Dataset.length);
    toks.forEach(w=>{
      if(counts[w]) log[l]+=Math.log(((counts[w][l]||0)+1)/(totals[l]+V));
    });
  });
  const max=Math.max(...labs.map(l=>log[l]));
  const ex={}; let sum=0;
  labs.forEach(l=>{ex[l]=Math.exp(log[l]-max);sum+=ex[l]});
  const probs={}; labs.forEach(l=>probs[l]=ex[l]/sum);
  const pred=labs.slice().sort((a,b)=>probs[b]-probs[a])[0];
  return {pred,probs,toks,counts,totals,docs,V,log};
}

function bindStepJumps(){stepScrollCleanup?.();stepScrollCleanup=undefined;const bar=document.querySelector('.sticky-steps');if(!bar)return;const sections=[...document.querySelectorAll('.step-section')],buttons=[...bar.querySelectorAll('[data-step-jump]')];const update=()=>{const edge=bar.getBoundingClientRect().bottom+28;let current=sections[0];sections.forEach(section=>{if(section.getBoundingClientRect().top<=edge)current=section;});buttons.forEach(button=>{const active=current.id===`ml-step-${button.dataset.stepJump}`;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});};buttons.forEach(button=>button.onclick=()=>{const target=$(`ml-step-${button.dataset.stepJump}`);target.focus({preventScroll:true});const offset=bar.offsetHeight+24;window.scrollTo({top:window.scrollY+target.getBoundingClientRect().top-offset,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});});window.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);stepScrollCleanup=()=>{window.removeEventListener('scroll',update);window.removeEventListener('resize',update);};update();}
function linear(){const ds=demoScore();return `<div class="eyebrow">LINEAR CLASSIFIERS</div><h2>See how features become a prediction.</h2>${card('learn','LEARN','<p class="copy">A <b>linear classifier</b> is a type of model that looks at multiple pieces of information, gives each piece a level of importance, and combines them to sort something into one of two <b>classes</b>.</p>')}${card('learn','LEARN','<p class="copy">A weight tells the model two things: <b>which direction</b> a feature should push the decision, and <b>how strongly</b> it should push.</p>')}${card('next','OUR EXAMPLE','<p class="copy">Lineball classifies <b>Good Movies</b> and <b>Bad Movies</b>. It checks movie features, such as positive reviews, and adds their weights.</p>')}<div class="balanceBox"><div class="scoreQuestion">Example: Is this a good movie or a bad movie?</div>${balanceSVG(ds)}<div class="weightTray">${demoWeights.map((x,i)=>`<button class="weightChip ${x.w<0?'neg':''} ${s.demo[i]?'on':''}" aria-pressed="${s.demo[i]}" data-demo="${i}">${esc(x.name)} ${x.w>0?'+':''}${x.w}</button>`).join('')}</div><div class="demoCaption">Click the feature weights on and off. Watch the physical scale and score line move together.</div><div aria-live="polite">${scoreLine('BAD MOVIE','GOOD MOVIE','The same decision, represented as a score line',ds)}</div></div>${card('important','IMPORTANT REMINDER','<h3>Negative does not mean unimportant.</h3><p class="copy"><b>Negative weights</b> push toward <b>Class A (−)</b>. <b>Positive weights</b> push toward <b>Class B (+)</b>. The farther a weight is from <b>0</b>, the stronger the push. So <b>−5 is very important</b>, just in the direction of Class A.</p><p class="copy"><b>This is another place where clarity of language matters.</b></p>')}<div class="section"><h3>Watch a classifier make a prediction.</h3>${card('learn','LEARN','<p class="copy">The model does <b>not</b> use every weight every time. It checks the item, finds which features are present, and only adds the weights for those features.</p>')}<div class="flow"><div>1<br>CHECK FEATURES</div><div>2<br>USE PRESENT WEIGHTS</div><div>3<br>ADD SCORE</div><div>4<br>PREDICT A CLASS</div></div><div id="movies">${movieDemoHTML().replace(/src="(godfather|cats|cabin)\.jpg"/g,'src="https://raw.githubusercontent.com/mrrobertpino/lineball/main/$1.jpg"')}</div></div>${testing()}${card('next','WHAT TO NOTICE','<p class="copy">If the model agrees with our expected label, that example was classified the way we expected. If it does not, that tells us the model may need improvement.</p>')}${inspecting()}${card('next','WHAT TO NOTICE','<p class="copy">If the model disagrees with you, ask: <b>Which feature or weight pushed the score in the wrong direction?</b></p>')}${card('learn','LEARN','<h3>Two ways to improve a linear classifier</h3><div class="compare"><div class="metric"><strong>FEATURES</strong>Give the model better or more useful information to examine.</div><div class="metric"><strong>WEIGHTS</strong>Change how strongly each feature pushes the prediction toward either class.</div></div>')}`;}
const nbClass=l=>`<span class="nb-label ${l.toLowerCase()}">${l}</span>`;
function bayes(){const m=p2Predict(nbText),vocab=Object.keys(m.counts).sort();return `<div class="eyebrow">NAIVE BAYES · QUICK REFRESHER</div><h2>How does BayesBall sort a message?</h2>${card('learn','LEARN','<p class="copy">A <b>Naive Bayes classifier</b> learns how <b>features</b> relate to each class. It combines their evidence to predict a class.</p><p class="copy"><b>Our example:</b> BayesBall counts words to classify email type: Personal, Promotional, or Spam. Here, the words are our features. Other Naive Bayes models can use measurements or other details.</p>')}${card('theory','THEORY','<h3>Training builds probabilities. One example does not become a rule.</h3><p class="copy">In BayesBall, each labeled training message contributes to the word counts for its class. Those counts become probabilities: how likely each word is within each class.</p><p class="copy">The idea is that, with <b>enough useful, varied, consistently labeled examples</b>, these probabilities can capture patterns in the data. For a new message, the model combines the starting probability of each class with the evidence from its words.</p><p class="copy"><b>One word does not decide the class by itself.</b> The model combines all the word clues it recognizes. It treats those clues as independent once the class is known—that is the “naive” assumption.</p><p class="copy">More data can help, but wrong labels can teach misleading patterns. In this activity, testing a sentence does not add it to the training data.</p>')}<div class="flow nb-flow"><div>1<br>START WITH LABELED MESSAGES</div><div>2<br>COUNT WORDS IN EACH CLASS</div><div>3<br>COMBINE THE WORD CLUES</div><div>4<br>PREDICT A CLASS</div></div><section class="section"><div class="eyebrow">1 · DATASET</div><h3>Start with examples and labels.</h3>${card('learn','LEARN','<p class="copy">A <b>label</b> is the class we say a message belongs to. These 20 messages teach the model what words appear in each class.</p>')}<div class="nb-dataset">${p2Dataset.map(([t,l],i)=>`<div class="nb-row"><b>${i+1}. ${esc(t)}</b><div>${nbClass(l)}</div></div>`).join('')}</div></section><section class="section"><div class="eyebrow">2 · TRAIN</div><h3>Count the words. Learn the clues.</h3>${card('learn','LEARN','<p class="copy"><b>Training</b> means learning from the labeled examples. This model counts how often each word appears in each class.</p><p class="copy">A word can appear in more than one class. <b>“Free” does not automatically mean Spam.</b> The other words matter too.</p>')}<div class="nb-inspect"><div><h3>Learned words</h3><div class="nb-wordgrid">${vocab.map(w=>`<button class="nb-word ${w===nbWord?'active':''}" data-word="${w}" aria-pressed="${w===nbWord}">${w}</button>`).join('')}</div></div><div><h3>“${nbWord}”</h3>${nbWordResult(m)}${card('next','WHAT TO NOTICE','<p class="copy">These bars show <b>word counts</b>. The model turns the counts into probabilities, then combines the clues from a whole message.</p>')}<details class="nb-math"><summary><b>See the math</b></summary><div class="tablewrap">${modelTable(m,nbWord)}</div></details></div></div></section><section class="section"><div class="eyebrow">3 · TEST</div><h3>Try your own sentence.</h3>${testing()}<div class="task"><div class="field"><label for="nbText">YOUR MESSAGE</label><textarea id="nbText" placeholder="Example: Hey, are we still meeting after school?">${esc(nbText)}</textarea></div><div class="field" style="margin-top:14px"><label for="nbLabel">Which class do YOU expect?</label><select id="nbLabel">${['Personal','Promotional','Spam'].map(l=>`<option ${l===nbLabel?'selected':''}>${l}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" id="nbRun">Test sentence</button></div><div id="nbResult" aria-live="polite">${nbTested?nbResult(m):'<p class="copy">Choose your expected label, then test the sentence.</p>'}</div><h3 style="margin-top:22px">Test History</h3><div id="nbHistory">${historyHTML()}</div></div></section><section class="section"><div class="eyebrow">4 · INSPECT</div><h3>Which words pushed the prediction?</h3>${inspecting()}${card('next','TRY THIS','<p class="copy">Test <b>“free”</b>. Then try <b>“are you free after school”</b> and <b>“claim your free prize”</b>. The same word can be part of very different messages.</p><p class="copy">Reverse the word order. This model counts words; it does not understand their order. Words it never learned are ignored.</p>')}</section><section class="section"><div class="eyebrow">5 · EVALUATE</div><h3>How well did it work?</h3>${card('learn','LEARN','<p class="copy"><b>Evaluating</b> means judging how well the model performed and what should change. Did its predictions match the labels you expected? Look closely at the mistakes.</p>')}${card('next','IMPROVE THE MODEL','<p class="copy">Better and more varied labeled examples can teach the model better word clues. Then we test again using new messages.</p>')}${card('important','REMEMBER','<p class="copy">This is a small teaching model. Its labels are examples, not rules for every message. The percentages compare the model\'s three classes; they do not prove a message is safe.</p><p class="copy">Testing a sentence does not add it to the training data.</p>')}</section>`;}
function historyHTML(){return nbHistory.length?nbHistory.map((h,i)=>`<div class="nb-row"><b>${nbHistory.length-i}. ${esc(h.text)||'(empty message)'}</b><p class="small">Expected: ${h.label} · Prediction: ${h.pred} · <span class="${h.label===h.pred?'correct':'incorrect'}">${h.label===h.pred?'MATCH':'DOES NOT MATCH'}</span></p></div>`).join(''):'<p class="small">No tests yet.</p>';}
function nbWordResult(m){const max=Math.max(1,...Object.values(m.counts[nbWord]));return ['Personal','Promotional','Spam'].map(l=>`<div class="barrow"><div>${nbClass(l)}</div><div class="track"><div class="nb-fill ${l.toLowerCase()}" style="width:${m.counts[nbWord][l]/max*100}%"></div></div><b>${m.counts[nbWord][l]}</b></div>`).join('');}
function nbResult(m){const recognized=m.toks.filter(w=>m.counts[w]);return `<div class="prediction"><span class="semanticTag">RESULT</span><h3>Prediction: ${nbClass(m.pred)}</h3><p class="${m.pred===nbLabel?'correct':'incorrect'}"><b>${m.pred===nbLabel?'MATCH':'DOES NOT MATCH'}</b> your expected label: ${nbLabel}</p>${Object.entries(m.probs).map(([l,p])=>`<div class="barrow"><div>${nbClass(l)}</div><div class="track"><div class="nb-fill ${l.toLowerCase()}" style="width:${p*100}%"></div></div><span>${(p*100).toFixed(1)}%</span></div>`).join('')}<h3>The words it checked</h3><div class="wordlist">${m.toks.map(w=>`<span class="token ${m.counts[w]?'':'unknown'}">${esc(w)}</span>`).join('')||'<span>No words remain after processing.</span>'}</div><p class="small">Crossed-out words were never learned. Common words such as “the” and “and” are removed.</p>${recognized.length?`<details><summary><b>Inspect each word's clues</b></summary><p class="copy">Each percentage shows how likely that word is within a class in this model. The model combines all these clues.</p><div class="tablewrap"><table><thead><tr><th>Word</th><th>Personal</th><th>Promotional</th><th>Spam</th></tr></thead><tbody>${recognized.map(w=>`<tr><th>${esc(w)}</th>${['Personal','Promotional','Spam'].map(l=>`<td>${((m.counts[w][l]+1)/(m.totals[l]+m.V)*100).toFixed(1)}%</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`:'<p class="copy">No learned words were found. The model uses only its starting class probabilities. Personal and Promotional each have seven of the 20 training messages; Spam has six. The two largest starting probabilities tie, so this demo chooses Personal.</p>'}<details class="nb-math"><summary><b>See the math</b></summary><div class="tablewrap">${predictionMath(m)}</div></details></div>`;}

const trainingExamples=[
 {movie:0,label:'BAD MOVIE',direction:-1,prompt:'What happens if we train it with The Godfather labeled BAD MOVIE?'},
 {movie:1,label:'GOOD MOVIE',direction:1,prompt:'What happens if we train it with Cats labeled GOOD MOVIE?'}
];
let trainedExamples=[false,false];
const signed=n=>(n>0?'+':'')+n;
function trainingScore(bits,weights){return weights.reduce((n,w,i)=>n+(bits[i]?w:0),0);}
function trainingExampleHTML(e,index){const m=movieDemos[e.movie],before=demoWeights.map(f=>f.w),after=before.map((w,i)=>w+(m.bits[i]?e.direction:0)),done=trainedExamples[index],start=trainingScore(m.bits,before),end=trainingScore(m.bits,after),current=done?end:start;
 return `<section class="section training-example" id="training-example-${index}"><div class="eyebrow">EXAMPLE ${index+1} · ${e.direction<0?'PUSH TOWARD BAD':'PUSH TOWARD GOOD'}</div><h3>${m.name}</h3><div class="movieStage"><div class="posterFrame"><img src="https://raw.githubusercontent.com/mrrobertpino/lineball/main/${m.poster}" alt="${m.name} poster"></div><div><div class="semantic ${e.direction<0?'important':'next'}"><span class="semanticTag">NEW TRAINING DATA</span><p class="copy"><b>Label: ${e.label}</b></p><p class="copy">Starting prediction: <b>${start<0?'BAD MOVIE':'GOOD MOVIE'}</b>. It disagrees with this label.</p></div><div class="featureLights">${demoWeights.map((f,i)=>`<div class="featureLight ${m.bits[i]?(f.w<0?'on neg':'on pos'):'off'}"><span class="label">${f.name}${m.bits[i]?'':' · not present'}</span><span class="value" id="training-weight-${index}-${i}">${done&&m.bits[i]?`${signed(before[i])} → ${signed(after[i])}`:signed(before[i])}</span></div>`).join('')}</div></div></div><div class="balanceBox training-visual" id="training-visual-${index}" tabindex="-1" aria-label="Training scale and score line"><div id="training-scale-${index}">${balanceSVG(current)}</div><div id="training-line-${index}">${scoreLine('BAD MOVIE','GOOD MOVIE','Model score',current)}</div></div>${card('do','WHAT IF?',`<p class="copy"><b>${e.prompt}</b></p><p class="copy">The training algorithm ${e.direction<0?'subtracts 1 from':'adds 1 to'} each weight whose feature is present.</p><button class="btn primary" data-train-example="${index}" ${done?'disabled':''}>${done?'Trained once':'Train with new data'}</button>`)}<div id="training-shift-${index}" aria-live="polite">${done?trainingShift(e,start,end):''}</div></section>`;
}
function trainingShift(e,start,end){return card('next','THE CHANGE',`<div class="training-change">${signed(start)} → ${signed(end)} <span>(${signed(end-start)} points)</span></div><p class="copy">The score moved toward <b>${e.label}</b>. One update moved it closer; it did not change the predicted class yet.</p>`);}
function learning(){return `<div class="eyebrow">MACHINE LEARNING</div><h2>Watch training change the weights.</h2>${card('learn','LEARN','<p class="copy"><b>Machine learning</b> uses examples to adjust a model. When a prediction disagrees with a training label, the algorithm changes the weights to push toward that label.</p>')}${card('theory','THEORY','<h3>Training shifts the weights. It does not instantly learn the new label.</h3><p class="copy">One training update pushes the weights toward the label. The model may still predict the same class afterward.</p><p class="copy">The idea is that, with <b>enough useful examples and enough weight adjustments</b>, the model can learn a pattern: which features matter, and how strongly they should push, to match the preferences shown in the labels.</p><p class="copy">For movies, that means learning what the person doing the labeling tends to like or dislike. The pattern depends on the examples and labels it gets.</p>')}<p class="copy">Both examples start with the original Lineball weights. Each button makes just <b>one training update</b>.</p>${card('important','TRAINING ACCURACY IS NOT THE WHOLE STORY','<p class="copy"><b>A model can get better at matching its training data while getting worse at making useful predictions.</b></p><p class="copy">These examples deliberately label The Godfather BAD and Cats GOOD, opposite to the original lesson labels. Training pushes toward the labels it gets, even when they are wrong. Check usefulness on separate examples with trustworthy labels.</p>')}${trainingExamples.map(trainingExampleHTML).join('')}${card('learn','LEARN','<p class="copy">The model follows the labels it is given. It does not know whether a label is right. <b>Different labels push the weights in different directions.</b></p>')}`;}
function bindML(){document.querySelectorAll('[data-train-example]').forEach(button=>button.onclick=()=>{const index=+button.dataset.trainExample;if(trainedExamples[index])return;trainedExamples[index]=true;const e=trainingExamples[index],m=movieDemos[e.movie],before=demoWeights.map(f=>f.w),after=before.map((w,i)=>w+(m.bits[i]?e.direction:0)),start=trainingScore(m.bits,before),end=trainingScore(m.bits,after);button.disabled=true;button.textContent='Trained once';const finish=()=>{if(route!=='learning')return;demoWeights.forEach((f,i)=>{const node=$(`training-weight-${index}-${i}`);if(node)node.textContent=m.bits[i]?`${signed(before[i])} → ${signed(after[i])}`:signed(before[i]);});$(`training-shift-${index}`).innerHTML=trainingShift(e,start,end);};const draw=score=>{if(route!=='learning')return;$(`training-scale-${index}`).innerHTML=balanceSVG(score);$(`training-line-${index}`).innerHTML=scoreLine('BAD MOVIE','GOOD MOVIE','Model score',Math.round(score*10)/10);};const visual=$(`training-visual-${index}`);visual.focus({preventScroll:true});visual.scrollIntoView({block:'start',behavior:'instant'});if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){requestAnimationFrame(()=>{draw(end);finish();});return;}let begun;function frame(time){if(route!=='learning')return;begun??=time;const p=Math.min(1,(time-begun)/900);draw(start+(end-start)*(p*p*(3-2*p)));if(p<1)requestAnimationFrame(frame);else finish();}requestAnimationFrame(()=>requestAnimationFrame(frame));});}
function compare(){return `<div class="eyebrow">COMPARE MODELS</div><h2>Different models. The same learning cycle.</h2>${card('learn','LEARN','<p class="copy">Both models use information to predict a <b>class</b>. They combine the evidence in different ways.</p>')}<div class="tablewrap"><table class="comparetable"><thead><tr><th>What to compare</th><th>Naive Bayes · BayesBall</th><th>Linear Classifier · Lineball</th></tr></thead><tbody>${[
['What does it check?','Features. In BayesBall, the features are words.','Features. In Lineball, they are movie details.'],
['What numbers does it use?','Probabilities learned from labeled examples.','Weights that show direction and strength.'],
['How does it combine clues?','Combines the starting class probability with probabilities for the features.','Combines feature values and weights into a score. Lineball adds weights for present features.'],
['Our example','Counts words to classify email type: Personal, Promotional, or Spam.','Checks movie features to classify Good Movies and Bad Movies.'],
['How does it learn?','Learns how features relate to each class. BayesBall counts words and calculates probabilities.','A training algorithm can adjust weights using labeled examples.'],
['What did we adjust ourselves?','We typed messages to test a model already trained on 20 examples.','In Lineball, the programmer or student chose the weights.'],
['What can go wrong?','A word can appear in different classes; word order is ignored.','Unhelpful features or poor weights can push the score the wrong way.'],
['What do both need?','Useful examples, clear labels, and testing.','Useful examples, clear labels, and testing.']
].map(row=>`<tr><th>${row[0]}</th><td>${row[1]}</td><td>${row[2]}</td></tr>`).join('')}</tbody></table></div>${card('learn','MACHINE LEARNING','<h3>Use a model. Let it learn from examples.</h3><p class="copy">Machine learning can use either of these model types. Rather than having a programmer adjust every value by hand, a training algorithm learns the values from examples.</p><p class="copy">For <b>Naive Bayes</b>, it learns word probabilities. For a <b>linear classifier</b>, it can learn weights. BayesBall already learns its word probabilities from its labeled messages.</p>')}${card('next','WHAT TO REMEMBER','<p class="copy">The programmer still chooses the model, the training method, and the data. “Self-adjusting” means the algorithm updates model values during training. It does not mean the model decides what is true.</p>')}${card('important','WRONG LABELS MATTER','<p class="copy">A model can learn a wrong label very well. That is why we still need the five steps: <b>Dataset, Train, Test, Inspect, Evaluate.</b></p>')}`;}
const questions=[
['What is a class?',['A category the model can predict.','A number showing importance.','A collection of examples.'],0,'A class is one of the categories a model can predict.'],
['What is the correct order of the five steps?',['Train, Dataset, Inspect, Evaluate, Test','Dataset, Train, Test, Inspect, Evaluate','Dataset, Test, Evaluate, Train, Inspect'],1,'Start with the dataset, train, test, inspect the decisions, then evaluate.'],
['What does a weight tell a linear classifier?',['Only whether a feature is important.','Which class is always correct.','Which direction a feature pushes and how strongly.'],2,'The sign gives direction. Distance from zero gives strength.'],
['Which weight gives the strongest push?',['−5','+2','0'],0,'−5 is five points from zero. Negative does not mean unimportant.'],
['Only “Too long −2” and “Positive reviews +4” are present. What is the score?',['+6','+2','−2'],1,'Only present features count: −2 + 4 = +2.'],
['What does testing mean?',['Changing weights until they look right.','Looking only at the training score.','Checking predictions against the results we expect.'],2,'Use examples with known expected labels and compare the predictions.'],
['What does inspecting mean?',['Looking closely at the model’s decisions.','Collecting more examples without looking at predictions.','Only reporting the final score.'],0,'Inspection asks how and why the model made its decisions.'],
['What is the “naive” assumption in Naive Bayes?',['Every class is equally likely.','Features are independent given the class.','The model understands the whole message.'],1,'The model treats features as independent once the class is known. In BayesBall, those features are words.'],
['What happens if you reverse word order in this BayesBall model?',['It always becomes spam.','It trains new weights.','The evidence stays the same.'],2,'This model counts words and ignores their order.'],
['How can you improve a linear classifier?',['Use better features or adjust weights based on evidence.','Remove every negative weight.','Always predict the same class.'],0,'Features control what the model checks; weights control the direction and strength of each push.'],
['A model matches all its training examples. What should you do next?',['Assume it works for every new example.','Test it on separate examples with known labels.','Stop inspecting its decisions.'],1,'Training success is not the same as performance on new examples.'],
['In the training demo, who adjusts the weights?',['An algorithm using labeled examples.','The test messages automatically.','The movie poster.'],0,'The training algorithm updates weights when a training prediction disagrees with the label.'],

['A movie has Bad trailer −3 and Too long −2. The other features are absent. What does the model predict?',['GOOD MOVIE with a score of +5.','BAD MOVIE with a score of −5.','BAD MOVIE with a score of −1.'],1,'Only present features count: −3 + (−2) = −5, which pushes toward BAD MOVIE.'],
['The Godfather starts at +4. One update subtracts 1 from each of its three present-feature weights. What happens?',['Its score becomes +1, so it still predicts GOOD MOVIE.','Its score becomes −1, so it predicts BAD MOVIE.','Its score stays +4 because the label was wrong.'],0,'Three present weights each drop by 1: +4 − 3 = +1. Training moves the score without necessarily changing the prediction.'],

['A model matches more deliberately incorrect training labels after training. What does that show?',['Its useful predictions must have improved.','The incorrect labels have become true.','Training agreement can improve while useful predictions get worse.'],2,'The model learns from the labels it is given. Better agreement with poor labels does not mean better predictions on correctly labeled new examples.'],
['You keep changing weights until the model matches the same test movies. What is the best next check?',['Test on new movies with known labels.','Report the old score as proof it works everywhere.','Remove the labels from the old movies.'],0,'The old examples influenced your changes. Separate new examples give a better check of how the revised model handles new data.']];
let answers={},graded=false;
function quiz(){let n=questions.filter((q,i)=>answers[i]===q[2]).length;return `<div class="eyebrow">CHECK YOUR UNDERSTANDING</div><h2>Quiz</h2><p class="copy">This quiz is not graded for class. Choose one answer for each question. Check answers shows a practice score and explains each result.</p><form id="quizForm">${questions.map((q,i)=>`<fieldset class="quizq"><legend>${i+1}. ${q[0]}</legend>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}>${a}</label>`).join('')}${graded?`<div class="feedback ${answers[i]===q[2]?'correct':'incorrect'}">${answers[i]===q[2]?'✓ Correct':answers[i]===undefined?'Unanswered':'✕ Try again'} — ${q[3]}</div>`:''}</fieldset>`).join('')}<div class="actions"><button type="submit" class="btn primary">Check answers</button><button type="button" class="btn" id="quizReset">Reset quiz</button></div></form><div id="quizScore" aria-live="polite">${graded?`<div class="resultHero"><div class="big">${n} / ${questions.length}</div><p>${Math.round(n/questions.length*100)}% · ${Object.keys(answers).length} questions answered</p><p class="copy">Review the explanations, change your answers, and check again.</p></div>`:''}</div>`;}
function bind(){document.querySelectorAll('[data-step-link]').forEach(b=>b.onclick=()=>{step=+b.dataset.stepLink;location.hash='steps'});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()});document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{s.demo[+b.dataset.demo]=!s.demo[+b.dataset.demo];render(`demo:${b.dataset.demo}`)});document.querySelectorAll('[data-movie]').forEach(b=>b.onclick=()=>{s.movieDemo=+b.dataset.movie;render(`movie:${b.dataset.movie}`)});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{nbWord=b.dataset.word;render(`word:${nbWord}`)});
if($('nbText')){$('nbText').oninput=e=>{nbText=e.target.value;nbTested=false;$('nbResult').innerHTML='<p class="copy">Message changed. Test again to reveal the new prediction.</p>'};$('nbLabel').onchange=e=>{nbLabel=e.target.value;nbTested=false;$('nbResult').innerHTML='<p class="copy">Expected label changed. Test again to compare.</p>'};$('nbRun').onclick=()=>{nbTested=true;const r=p2Predict(nbText);nbHistory.unshift({text:nbText,label:nbLabel,pred:r.pred});$('nbResult').innerHTML=nbResult(r);$('nbHistory').innerHTML=historyHTML()};}
if(route==='learning')bindML();
if($('quizForm')){$('quizForm').onchange=e=>{answers[+e.target.name.slice(1)]=+e.target.value;if(graded){graded=false;document.querySelectorAll('.feedback').forEach(n=>n.remove());$('quizScore').innerHTML='<p class="copy">Answers changed. Grade again for an updated score.</p>'}};$('quizForm').onsubmit=e=>{e.preventDefault();graded=true;render();$('quizScore').scrollIntoView({block:'center',behavior:'smooth'})};$('quizReset').onclick=()=>{answers={};graded=false;render()};}}
function render(focus){$('tabs').innerHTML=routes.map(([id,label])=>`<a href="#${id}" ${id===route?'aria-current="page"':''}>${label}</a>`).join('');$('view').innerHTML=({summary,steps,bayes,linear,learning,compare,quiz})[route]();bind();bindStepJumps();bindPrequiz();if(focus){let [type,val]=focus.split(':');document.querySelector(`[data-${type}="${val}"]`)?.focus({preventScroll:true})}}
function navigate(){route=routes.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'summary';render();window.scrollTo(0,0)}
$('themeBtn').onclick=()=>{const light=document.body.classList.toggle('light');$('themeBtn').textContent=light?'Dark mode':'Light mode'};
const prequizQuestions=[
 ['You want to check whether a model works on new examples. What should you do?',['Train on those examples.','Compare predictions with their known labels.','Only inspect the training score.'],1,'steps'],
 ['BayesBall uses the word “free.” What else matters?',['The other recognized words and their evidence.','Nothing: free always means Spam.','Only the order of the words.'],0,'bayes'],
 ['Present features have weights −2 and +4. What is the score?',['−6','+6','+2'],2,'linear'],
 ['How do the two models combine evidence?',['Both simply add movie weights.','Naive Bayes combines probabilities; Lineball adds present-feature weights.','Both ignore features.'],1,'compare'],
 ['One training update shifts a score from +4 to +1. What happened?',['The model must now predict BAD.','It did not learn anything because the class stayed the same.','The weights changed, but it still predicts GOOD.'],2,'learning']
];
let preAnswers={},preGraded=false;
function prequizResults(){const misses=prequizQuestions.filter((q,i)=>preAnswers[i]!==q[2]).map(q=>q[3]);return `<p class="copy"><b>${prequizQuestions.filter((q,i)=>preAnswers[i]===q[2]).length} / 5 correct.</b> ${misses.length?'These pages can help with the questions you missed or skipped:':'You have the main ideas. Review any page you have questions about, then try the final quiz.'}</p>${misses.length?`<div class="review-links">${misses.map(id=>`<a class="btn" href="#${id}">${routes.find(r=>r[0]===id)[1]}</a>`).join('')}</div>`:''}`;}
function prequizHTML(){return `<details class="task prequiz"><summary><b>Quick prequiz · Find what to review</b></summary><p class="copy">Five questions. This is a starting check, not a grade. Skipped questions also suggest pages to review.</p><form id="prequizForm">${prequizQuestions.map((q,i)=>`<fieldset class="quizq"><legend>${i+1}. ${q[0]}</legend>${q[1].map((answer,j)=>`<label><input type="radio" name="pre${i}" value="${j}" ${preAnswers[i]===j?'checked':''}>${answer}</label>`).join('')}</fieldset>`).join('')}<button class="btn primary" type="submit">Suggest pages to review</button></form><div id="prequizResults" aria-live="polite">${preGraded?prequizResults():''}</div></details>`;}
function bindPrequiz(){const form=$('prequizForm');if(!form)return;form.onchange=e=>{preAnswers[+e.target.name.slice(3)]=+e.target.value;preGraded=false;$('prequizResults').innerHTML='';};form.onsubmit=e=>{e.preventDefault();preGraded=true;$('prequizResults').innerHTML=prequizResults();};}
window.addEventListener('hashchange',navigate);navigate();
const vocabulary=[['Model','A system that uses information to make predictions.'],['Classifier','A model that predicts a class.'],['Class','One of the categories a classifier can predict.'],['Feature','A piece of information the model checks.'],['Label','The class we say an example should belong to.'],['Dataset','A collection of examples used to build, train, or test a model.'],['Prediction','The class chosen by the model.'],['Weight','A number showing which direction a feature pushes the score and how strongly.'],['Score','The total after the model combines the evidence.'],['Probability','A number describing how likely something is according to a model.'],['Bias','A starting score added to every example in some linear models.'],['Naive Bayes','A classifier that learns how features relate to classes, then combines their evidence.'],['Linear classifier','A model that combines weighted features into a score to predict a class.'],['Machine learning','Using examples to learn or adjust a model’s values.'],['Train','Use labeled examples to learn or improve a model.'],['Test','Check whether predictions match the results we expect.'],['Inspect','Look closely at how the model made its decisions.'],['Evaluate','Judge how well the model worked and what should change.']];
const vocabToggle=$('vocabToggle'),vocabDrawer=$('vocabDrawer');
$('vocabTerms').innerHTML=vocabulary.map(([name,definition])=>`<div class="term"><dt>${name}</dt><dd>${definition}</dd></div>`).join('');
function setVocab(open){vocabDrawer.hidden=!open;$('vocabDock').classList.toggle('open',open);vocabToggle.setAttribute('aria-expanded',String(open));if(open)$('vocabClose').focus();else vocabToggle.focus();}
vocabToggle.onclick=()=>setVocab(vocabDrawer.hidden);
$('vocabClose').onclick=()=>setVocab(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!vocabDrawer.hidden)setVocab(false)});
document.addEventListener('click',e=>{if(!vocabDrawer.hidden&&!$('vocabDock').contains(e.target))setVocab(false)});
</script></body></html>
